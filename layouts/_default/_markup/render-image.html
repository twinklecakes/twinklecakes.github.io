{{- /* ![alt text](photo.jpg "description") — the quoted description shows under
       the image when it's enlarged in the lightbox. */ -}}
{{- $src := .Destination -}}
{{- with .Page.Resources.GetMatch .Destination -}}{{- $src = .RelPermalink -}}{{- end -}}
<img src="{{ $src }}" alt="{{ .Text }}" loading="lazy"{{ with .Title }} data-caption="{{ . }}"{{ end }}>
