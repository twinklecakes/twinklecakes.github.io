baseURL = "https://avelynb.com/"
languageCode = "en-us"
title = "Avelyn Batts"
enableRobotsTXT = true

[params]
  tagline = "Nature. Storytelling. Untangling problems."
  # Email is kept in two parts so bots scanning this public repo don't find it
  # whole; the site puts it back together and hides it from bots on the page too.
  emailUser = "avelyn"
  emailDomain = "stanford.edu"
  repo = "https://github.com/twinklecakes/twinklecakes.github.io"
  linkedin = "https://www.linkedin.com/in/avelyn-batts-a457a0290"
  instagram = "https://www.instagram.com/avelynbatts/"

[permalinks]
  blog = "/blog/:slug/"
  gallery = "/gallery/:slug/"

[markup.goldmark.renderer]
  unsafe = true   # lets you drop raw HTML into posts when you need it

[taxonomies]

# Video that plays when you hover over the grandfather clock on the home page.
# Put the file in static/video/. start/end are in seconds (set start = 0 and
# end = 0 if the file is already trimmed to just the part you want).
[params.clockVideo]
  src = "/video/clock.mp4"
  start = 0   # already trimmed, so play (and loop) the whole clip
  end = 0
