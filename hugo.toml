baseURL = "https://avelynb.com/"
languageCode = "en-us"
title = "Avelyn Batts"
enableRobotsTXT = true

[params]
  tagline = "avelyn batts is an adventurer, an artist, & an academic. she is sailing ever outwards."   # used as the page description for search engines
  # Email is kept in two parts so bots scanning this public repo don't find it
  # whole; the site puts it back together and hides it from bots on the page too.
  emailUser = "avelyn"
  emailDomain = "stanford.edu"
  repo = "https://github.com/twinklecakes/twinklecakes.github.io"
  # Video that loops inside the grandfather clock on the home page (in static/video/).
  clockVideo = "/video/clock.mp4"
  linkedin = "https://www.linkedin.com/in/avelyn-batts-a457a0290"
  instagram = "https://www.instagram.com/avelynbatts/"

[permalinks]
  blog = "/blog/:slug/"
  gallery = "/gallery/:slug/"

[markup.goldmark.renderer]
  unsafe = true   # lets you drop raw HTML into posts when you need it

[taxonomies]   # none: no tag or category pages
